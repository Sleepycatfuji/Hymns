name: Validate hymn dataset
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python update_chorales.py --check
      - run: node tests/test_frontend.cjs
      - run: python build_release.py --output release
      - run: python verify_release.py --directory release
      - uses: actions/upload-artifact@v4
        with:
          name: hymns-release-${{ github.sha }}
          path: release/
          include-hidden-files: true
